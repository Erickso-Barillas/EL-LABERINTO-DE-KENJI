<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>El Laberinto de Kenji</title>
  
  <!-- CSS del juego -->
  <link rel="stylesheet" href="style.css">

  <!-- Favicons para navegadores web de escritorio y móviles -->
  <link rel="icon" type="image/png" sizes="96x96" href="assets/favicon-96x96.png">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="shortcut icon" href="assets/favicon.ico">

  <!-- Icono para dispositivos Apple (iPhone/iPad) -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

  <!-- Vinculación del manifiesto PWA -->
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <button id="btn-return-menu" class="hidden">🏠 Menú</button>

    <!-- PANTALLA 1: MENÚ PRINCIPAL -->
    <div id="menu-screen" class="screen">
      <div class="menu-card">
        <h1 class="game-title">El Laberinto de Kenji</h1>
        <button id="btn-play" class="btn-menu">Inicio!</button>
        <button id="btn-exit" class="btn-menu">Salida</button>
      </div>
    </div>

    <!-- PANTALLA 2: INTRODUCCIÓN -->
    <div id="intro-screen" class="screen hidden">
      <img id="intro-character" src="assets/personaje_intro.png" alt="Personaje">
      <div id="dialogue-box">
        <p id="dialogue-text">¡Hola! Bienvenido al laberinto de Kenji. ¿Estás listo para ayudarme a encontrar la salida?</p>
        <button id="btn-start-game">Continuar ></button>
      </div>
    </div>

    <!-- CONTROLES TÁCTILES PARA TABLET / MÓVIL -->
    <div id="touch-controls" class="hidden">
      <div class="dpad">
        <button id="btn-up" class="dpad-btn up">▲</button>
        <div class="dpad-middle">
          <button id="btn-left" class="dpad-btn left">◄</button>
          <button id="btn-down" class="dpad-btn down">▼</button>
          <button id="btn-right" class="dpad-btn right">►</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Lógica principal del juego -->
  <script src="main.js"></script>

  <!-- Registro del Service Worker para PWA u offline -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
          .catch(err => console.error('Error al registrar Service Worker:', err));
      });
    }
  </script>
</body>
</html>
